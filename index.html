'use strict';
const PLAN = [{"id":"2026-11","name":"November 2026","phase":"FOUNDATION","focus":"Find your starting point","deliverable":"A real vocal baseline + one original sketch + a tidy working folder","weeks":[{"id":"2026-11-w1","week":1,"title":"Set up the project","why":"One reliable place for music, writing and feedback.","done":"A simple folder system you can actually keep using.","steps":[{"id":"2026-11-w1-s1","title":"Create a YOEI folder","how":"Add subfolders: 01 Ideas, 02 Songs, 03 Recordings, 04 Feedback, 05 Business."},{"id":"2026-11-w1-s2","title":"Create a song log","how":"Use a document or spreadsheet with song name, date, status, key and next action."},{"id":"2026-11-w1-s3","title":"Set recurring work blocks","how":"Reserve 20 hours across the week. Protect songwriting and vocal time first."},{"id":"2026-11-w1-s4","title":"Make a 30-second idea capture","how":"Record one guitar or melody fragment and save it with a date."}]},{"id":"2026-11-w2","week":2,"title":"Record a singing baseline","why":"Don’t wait until you can sing “well.” You need a record of today.","done":"One unedited complete cover and notes on what needs work.","steps":[{"id":"2026-11-w2-s1","title":"Pick a comfortable cover key","how":"Try Asleep Among Endives or a simpler song; transpose until no note feels forced."},{"id":"2026-11-w2-s2","title":"Record a continuous take","how":"Phone or existing studio equipment is enough. Do not tune, comp or edit it."},{"id":"2026-11-w2-s3","title":"Listen back once with notes","how":"Write 3 specific issues: pitch, breath, timing, diction or expression."},{"id":"2026-11-w2-s4","title":"Find a vocal teacher or plan","how":"Compare affordable lessons. Do not pay until it fits your budget."}]},{"id":"2026-11-w3","week":3,"title":"Write without polishing","why":"The main obstacle is finishing a lyric, not writing poetry on day one.","done":"Ten concrete lines and one short chorus idea.","steps":[{"id":"2026-11-w3-s1","title":"Collect ten ordinary details","how":"Describe a real photo, bus ride, room, notebook or unfinished task."},{"id":"2026-11-w3-s2","title":"Write a four-line verse","how":"Use simple Thai or English. Show the scene instead of explaining the moral."},{"id":"2026-11-w3-s3","title":"Write one chorus sentence","how":"State what the scene means to you in words you would actually say."},{"id":"2026-11-w3-s4","title":"Read the words aloud","how":"Remove phrases that feel unnatural or overly dramatic."}]},{"id":"2026-11-w4","week":4,"title":"Make the first music sketch","why":"See how your guitar, melody and story actually sound together.","done":"A 45–90-second original sketch you can play back.","steps":[{"id":"2026-11-w4-s1","title":"Choose one musical motif","how":"Sing or play a 2–4-bar phrase you can remember the next day."},{"id":"2026-11-w4-s2","title":"Build a short progression","how":"Use your preferred harmony, but stop at 4–8 bars."},{"id":"2026-11-w4-s3","title":"Record voice or guide melody","how":"Record one straightforward pass over guitar or piano."},{"id":"2026-11-w4-s4","title":"Save version 01","how":"Export an MP3 and write one change to make next month."}]}]},{"id":"2026-12","name":"December 2026","phase":"WRITE","focus":"Finish song 01","deliverable":"One complete song demo, even if the recording is rough","weeks":[{"id":"2026-12-w1","week":1,"title":"Choose the first song","why":"A complete, simple song is more useful than five promising fragments.","done":"One idea with a defined subject and working title.","steps":[{"id":"2026-12-w1-s1","title":"Review November sketches","how":"Choose the idea with the clearest emotion and easiest vocal melody."},{"id":"2026-12-w1-s2","title":"Write the song in one sentence","how":"Example: finding an old photo and realising you changed."},{"id":"2026-12-w1-s3","title":"Choose a structure","how":"Start with verse / chorus / verse / chorus / outro. Change only if needed."},{"id":"2026-12-w1-s4","title":"Set a rough finish date","how":"Reserve the last week for a demo rather than new ideas."}]},{"id":"2026-12-w2","week":2,"title":"Write the whole song","why":"Avoid perfecting eight bars and never reaching the ending.","done":"Complete draft of melody, chords and words.","steps":[{"id":"2026-12-w2-s1","title":"Draft the first verse","how":"Use a specific scene and a simple emotional movement."},{"id":"2026-12-w2-s2","title":"Write a repeatable chorus","how":"Make the main sentence natural to sing; test it without accompaniment."},{"id":"2026-12-w2-s3","title":"Write the second verse","how":"Add information or a new perspective; avoid repeating verse one."},{"id":"2026-12-w2-s4","title":"Play from start to finish","how":"Keep going even when a line or chord needs revision."}]},{"id":"2026-12-w3","week":3,"title":"Check the songwriting","why":"Separate a song problem from a production problem.","done":"Version 02 of the song with clear melody and lyrics.","steps":[{"id":"2026-12-w3-s1","title":"Record voice plus guitar","how":"One take, no decorative production."},{"id":"2026-12-w3-s2","title":"Listen without your guitar","how":"Hum the melody. Notice whether the hook is memorable."},{"id":"2026-12-w3-s3","title":"Edit five awkward lyric lines","how":"Fix natural speech and rhythm before reaching for poetic words."},{"id":"2026-12-w3-s4","title":"Ask two trusted people","how":"Ask “What is this song about?” rather than “Is it good?”"}]},{"id":"2026-12-w4","week":4,"title":"Finish demo 01","why":"A rough finished song counts more than a beautiful unfinished session.","done":"Song 01 MP3, lyrics, project file and notes saved.","steps":[{"id":"2026-12-w4-s1","title":"Record a guide vocal","how":"Choose comfort and timing rather than chasing perfect tone."},{"id":"2026-12-w4-s2","title":"Add only essential instruments","how":"One lead voice, guitar, bass or quiet texture if needed."},{"id":"2026-12-w4-s3","title":"Export a clear demo","how":"Avoid heavy mastering; leave headroom and no clipping."},{"id":"2026-12-w4-s4","title":"File your materials","how":"Save MP3, lyrics, credits and the three most important revisions."}]}]},{"id":"2027-01","name":"January 2027","phase":"WRITE","focus":"Build song 02 and train the voice","deliverable":"A contrasting second song and a basic weekly vocal routine","weeks":[{"id":"2027-01-w1","week":1,"title":"Set your vocal routine","why":"Your voice needs regular, low-strain practice and feedback.","done":"Four repeatable vocal sessions each week.","steps":[{"id":"2027-01-w1-s1","title":"Set a 15–25-minute practice block","how":"Include easy warm-ups, pitch work and a short song phrase."},{"id":"2027-01-w1-s2","title":"Check your range comfortably","how":"Record where notes become difficult; do not force high or low notes."},{"id":"2027-01-w1-s3","title":"Work on breath and phrasing","how":"Practise one verse slowly, then at song tempo."},{"id":"2027-01-w1-s4","title":"Get technique feedback","how":"Use a qualified teacher when affordable; stop if singing causes pain."}]},{"id":"2027-01-w2","week":2,"title":"Create a contrasting song","why":"Three identical ballads will not demonstrate your range.","done":"Song 02 has a different groove, tempo or mood.","steps":[{"id":"2027-01-w2-s1","title":"Choose a different emotional angle","how":"Try warmth, irony, quiet joy or an everyday moment."},{"id":"2027-01-w2-s2","title":"Write a groove first","how":"Sketch a rhythmic guitar pattern or a gentle drum idea."},{"id":"2027-01-w2-s3","title":"Sing three hook options","how":"Record each immediately, without judging it."},{"id":"2027-01-w2-s4","title":"Select one arrangement direction","how":"Define instruments in a sentence and move on."}]},{"id":"2027-01-w3","week":3,"title":"Complete song 02","why":"The goal is a whole song, not a perfect chorus.","done":"Song 02 complete on paper and in a rough recording.","steps":[{"id":"2027-01-w3-s1","title":"Finish the structure","how":"Make every section connect, even with placeholder lyrics."},{"id":"2027-01-w3-s2","title":"Replace placeholder lines","how":"Focus on concrete language and singability."},{"id":"2027-01-w3-s3","title":"Record a stripped version","how":"Voice + guitar or piano first."},{"id":"2027-01-w3-s4","title":"Export demo 02","how":"Name the file clearly and update the song log."}]},{"id":"2027-01-w4","week":4,"title":"Review both songs","why":"We are looking for recurring artistic choices, not copying references.","done":"A short list of repeatable musical traits.","steps":[{"id":"2027-01-w4-s1","title":"Listen to songs 01 and 02 back-to-back","how":"Do they feel like the same artist?"},{"id":"2027-01-w4-s2","title":"Identify three traits","how":"Perhaps guitar tone, chord colour, melody shape or production texture."},{"id":"2027-01-w4-s3","title":"Identify one weakness","how":"Choose only the biggest issue to improve in February."},{"id":"2027-01-w4-s4","title":"Make a revision list","how":"Put no more than five meaningful changes per song."}]}]},{"id":"2027-02","name":"February 2027","phase":"WRITE","focus":"Finish song 03 and define your range","deliverable":"Three original demos with different purposes","weeks":[{"id":"2027-02-w1","week":1,"title":"Design song 03","why":"Let the third piece show your more composition-led side.","done":"A plan for a track unlike the first two.","steps":[{"id":"2027-02-w1-s1","title":"Choose a story or image","how":"Pick a subject that can develop over time."},{"id":"2027-02-w1-s2","title":"Choose one recurring motif","how":"Write or record a clear melody fragment."},{"id":"2027-02-w1-s3","title":"Plan the emotional arc","how":"Mark opening, change and ending in plain language."},{"id":"2027-02-w1-s4","title":"Pick the primary instruments","how":"Keep the core playable by you."}]},{"id":"2027-02-w2","week":2,"title":"Write song 03","why":"Make the expressive melody work before adding large orchestration.","done":"A complete composition with vocal or wordless guide.","steps":[{"id":"2027-02-w2-s1","title":"Draft the full chord map","how":"Write the sequence of sections from beginning to end."},{"id":"2027-02-w2-s2","title":"Create the vocal line","how":"Test whether the most important phrases are singable."},{"id":"2027-02-w2-s3","title":"Finish the lyric or vocal plan","how":"Decide where words add meaning and where space is better."},{"id":"2027-02-w2-s4","title":"Play it in one continuous take","how":"Fix any section where the song loses direction."}]},{"id":"2027-02-w3","week":3,"title":"Make demo 03","why":"Demonstrate sound identity without spending money.","done":"A third playable MP3 with clearly identifiable sections.","steps":[{"id":"2027-02-w3-s1","title":"Record the core instruments","how":"Prefer clean, intentional takes over layers."},{"id":"2027-02-w3-s2","title":"Add two signature textures","how":"For example, an ambient room element and a quiet motif return."},{"id":"2027-02-w3-s3","title":"Check listening on two systems","how":"Use your monitors and headphones at safe levels."},{"id":"2027-02-w3-s4","title":"Export and organise","how":"Save demo, lyrics, credits and arrangement notes."}]},{"id":"2027-02-w4","week":4,"title":"Prepare for listeners","why":"We need to hear what other people actually perceive.","done":"Three demos and a short feedback form.","steps":[{"id":"2027-02-w4-s1","title":"Level-match the three MP3s","how":"Avoid one demo seeming better simply because it is louder."},{"id":"2027-02-w4-s2","title":"Write a five-question form","how":"Ask emotion, most remembered moment, replay intent and clarity."},{"id":"2027-02-w4-s3","title":"Recruit suitable listeners","how":"Find people who like indie pop beyond your immediate friends."},{"id":"2027-02-w4-s4","title":"Choose a neutral presentation","how":"Share private links without telling them which song should win."}]}]},{"id":"2027-03","name":"March 2027","phase":"TEST","focus":"Find your strongest song","deliverable":"Structured responses and a clear lead-single candidate","weeks":[{"id":"2027-03-w1","week":1,"title":"Run a small listener test","why":"Your friends are useful but not a substitute for fresh ears.","done":"Feedback from approximately 15–25 relevant people, if feasible.","steps":[{"id":"2027-03-w1-s1","title":"Invite listeners","how":"Ask people who may genuinely listen to Thai/English alternative pop."},{"id":"2027-03-w1-s2","title":"Give the same instructions","how":"Tell everyone to listen privately and answer independently."},{"id":"2027-03-w1-s3","title":"Collect ratings and comments","how":"Note recall, emotion, favourite moment and replay intent."},{"id":"2027-03-w1-s4","title":"Avoid leading questions","how":"Do not say “this is my most personal song” before they listen."}]},{"id":"2027-03-w2","week":2,"title":"Check audience response","why":"What matters is consistent patterns, not one person’s taste.","done":"A one-page summary of what listeners heard.","steps":[{"id":"2027-03-w2-s1","title":"Count useful patterns","how":"Track recurring comments and which song listeners select."},{"id":"2027-03-w2-s2","title":"Separate clarity from taste","how":"A listener can understand a song without personally liking it."},{"id":"2027-03-w2-s3","title":"Check unprompted descriptions","how":"Did anyone hear the intended emotion without being told?"},{"id":"2027-03-w2-s4","title":"Capture critical comments","how":"Keep the negative responses and note possible fixes."}]},{"id":"2027-03-w3","week":3,"title":"Get expert critique","why":"A qualified outside ear can find structural problems quickly.","done":"Specific revision advice from at least one knowledgeable person.","steps":[{"id":"2027-03-w3-s1","title":"Select an experienced reviewer","how":"Songwriter, arranger, producer or teacher with relevant work."},{"id":"2027-03-w3-s2","title":"Send the demos and your goals","how":"Ask for concrete issues, not a general numerical score."},{"id":"2027-03-w3-s3","title":"Discuss vocal feasibility","how":"Which lead song best suits your current voice?"},{"id":"2027-03-w3-s4","title":"Prioritise the recommendations","how":"Decide which changes you accept and why."}]},{"id":"2027-03-w4","week":4,"title":"Select the lead candidate","why":"We pitch a clear best song rather than whatever you spent most time on.","done":"One lead candidate and a revision brief.","steps":[{"id":"2027-03-w4-s1","title":"Compare the three songs","how":"Balance your artistic priorities against the listener data."},{"id":"2027-03-w4-s2","title":"Choose the strongest entry point","how":"It should be engaging even in a simple arrangement."},{"id":"2027-03-w4-s3","title":"Write the five main revisions","how":"Melody, lyrics, structure, vocal and mix if needed."},{"id":"2027-03-w4-s4","title":"Archive the others safely","how":"Keep them as supporting demos; do not delete sessions."}]}]},{"id":"2027-04","name":"April 2027","phase":"REFINE","focus":"Make one convincing recording","deliverable":"One polished lead demo and a credible live take","weeks":[{"id":"2027-04-w1","week":1,"title":"Rewrite the lead song","why":"Fixing composition is usually more valuable than adding plugins.","done":"A song with final structure, lyric and harmonic plan.","steps":[{"id":"2027-04-w1-s1","title":"Cut weak sections","how":"Remove material that does not serve the emotion or momentum."},{"id":"2027-04-w1-s2","title":"Rewrite the weakest lyric","how":"Use a more concrete image or more natural phrase."},{"id":"2027-04-w1-s3","title":"Test the chorus without production","how":"Hum it the next day and see what remains."},{"id":"2027-04-w1-s4","title":"Freeze the written arrangement","how":"Stop making major changes after this review."}]},{"id":"2027-04-w2","week":2,"title":"Improve the performance","why":"The lead vocal is the first thing A&R should believe.","done":"A complete, convincing guide performance.","steps":[{"id":"2027-04-w2-s1","title":"Choose the key for your voice","how":"Not for guitar comfort or notation preference."},{"id":"2027-04-w2-s2","title":"Practise difficult phrases","how":"Work in short sections at a comfortable volume."},{"id":"2027-04-w2-s3","title":"Record a few complete takes","how":"Preserve natural dynamics and expression."},{"id":"2027-04-w2-s4","title":"Choose the most believable take","how":"Do not automatically pick the most technically perfect."}]},{"id":"2027-04-w3","week":3,"title":"Finish the lead demo","why":"Demonstrate quality with the tools you own.","done":"Exported stereo WAV/MP3 and organised session.","steps":[{"id":"2027-04-w3-s1","title":"Track the necessary parts","how":"Keep every instrument connected to the song purpose."},{"id":"2027-04-w3-s2","title":"Edit with restraint","how":"Fix distracting errors but preserve human phrasing."},{"id":"2027-04-w3-s3","title":"Check mix translation","how":"Listen quietly on speakers, headphones and one ordinary device."},{"id":"2027-04-w3-s4","title":"Get outside mix feedback","how":"Prioritise intelligibility, vocal balance and arrangement."}]},{"id":"2027-04-w4","week":4,"title":"Record a real performance","why":"A label should see what you can actually perform.","done":"One continuous voice-and-guitar video.","steps":[{"id":"2027-04-w4-s1","title":"Select a simple location","how":"Quiet room, window light, unobtrusive background."},{"id":"2027-04-w4-s2","title":"Rehearse the full song","how":"Sing and play without stopping or heavy editing."},{"id":"2027-04-w4-s3","title":"Film one clean take","how":"A phone on a fixed tripod is enough; check audio first."},{"id":"2027-04-w4-s4","title":"Export and keep private","how":"Save the video in your future pitch folder."}]}]},{"id":"2027-05","name":"May 2027","phase":"PACKAGE","focus":"Prepare your label package","deliverable":"An easy-to-open private pitch folder and concise EPK","weeks":[{"id":"2027-05-w1","week":1,"title":"Confirm your name and identity","why":"YOEI has potential name conflicts; do not pay for public branding prematurely.","done":"One practical name choice and consistent contact identity.","steps":[{"id":"2027-05-w1-s1","title":"Search major streaming services","how":"Check Yoei and close spellings to identify music-name collisions."},{"id":"2027-05-w1-s2","title":"Check handles and domains","how":"Note availability; you do not need to purchase everything."},{"id":"2027-05-w1-s3","title":"Check Thai trademark resources","how":"If you plan commercial use, ask a professional about legal risk."},{"id":"2027-05-w1-s4","title":"Choose a working presentation name","how":"Keep an alternative ready if necessary."}]},{"id":"2027-05-w2","week":2,"title":"Prepare clear written material","why":"A&R people should understand you in under one minute.","done":"Two-sentence pitch and a one-page bio.","steps":[{"id":"2027-05-w2-s1","title":"Write a two-sentence description","how":"Genre, sound and theme; no exaggerated claims."},{"id":"2027-05-w2-s2","title":"Write a short biography","how":"Mention guitar, composition, production and current debut project."},{"id":"2027-05-w2-s3","title":"Prepare Thai and English versions","how":"Use natural language rather than literal translation."},{"id":"2027-05-w2-s4","title":"Have someone edit both","how":"Remove grand statements and industry clichés."}]},{"id":"2027-05-w3","week":3,"title":"Assemble useful visuals","why":"Authentic photographs beat expensive generic styling.","done":"Three usable images and a tidy one-page EPK.","steps":[{"id":"2027-05-w3-s1","title":"Choose two outfits and a location","how":"Dark navy, linen and quiet interiors are starting references."},{"id":"2027-05-w3-s2","title":"Take three portraits","how":"Headshot, half-body and performance image; phone is acceptable."},{"id":"2027-05-w3-s3","title":"Build a single-page EPK","how":"Name, photos, short bio, songs, live video and contact."},{"id":"2027-05-w3-s4","title":"Check readability","how":"Open on a phone and send it to someone unfamiliar with your work."}]},{"id":"2027-05-w4","week":4,"title":"Put the pitch folder together","why":"Make it painless for a label to sample your work.","done":"One private link containing everything, access verified.","steps":[{"id":"2027-05-w4-s1","title":"Upload three songs","how":"Lead demo first; make sure files play without login problems."},{"id":"2027-05-w4-s2","title":"Add live video","how":"Use the continuous performance, not a misleading edited montage."},{"id":"2027-05-w4-s3","title":"Add credits and contact","how":"Include your role in composition, performance and recording."},{"id":"2027-05-w4-s4","title":"Test access as a stranger","how":"Open every link in a private browser window."}]}]},{"id":"2027-06","name":"June 2027","phase":"PITCH","focus":"Approach relevant labels","deliverable":"A researched shortlist and an initial round of targeted messages","weeks":[{"id":"2027-06-w1","week":1,"title":"Build a shortlist","why":"A good fit matters more than a large list.","done":"Five carefully chosen labels, teams or artist-service partners.","steps":[{"id":"2027-06-w1-s1","title":"Listen to each company’s recent releases","how":"Identify 2–3 relevant projects and campaigns."},{"id":"2027-06-w1-s2","title":"Check what each company actually provides","how":"Label, management, distribution and promotion are different."},{"id":"2027-06-w1-s3","title":"Find official contact routes","how":"Confirm current demo policy or request an introduction."},{"id":"2027-06-w1-s4","title":"Rank fit and explain why","how":"One sentence per company; avoid “they are famous.”"}]},{"id":"2027-06-w2","week":2,"title":"Decide what you are asking for","why":"You want marketing help, but need concrete commitments.","done":"One-page partnership request.","steps":[{"id":"2027-06-w2-s1","title":"List what you can do yourself","how":"Songs, guitar, arranging, recording and most production."},{"id":"2027-06-w2-s2","title":"List what you cannot fund","how":"Campaign management, advertisements, media and visual support."},{"id":"2027-06-w2-s3","title":"State deal preference","how":"A funded limited single/EP partnership is a starting point, not a demand."},{"id":"2027-06-w2-s4","title":"State hard constraints","how":"Doctoral schedule, protected savings and fair rights terms."}]},{"id":"2027-06-w3","week":3,"title":"Write targeted messages","why":"Short, relevant emails are better than generic bulk pitches.","done":"Five personalised drafts, each checked before sending.","steps":[{"id":"2027-06-w3-s1","title":"Lead with the music","how":"Put one private listening link near the top."},{"id":"2027-06-w3-s2","title":"Say why that team fits","how":"Refer accurately to work they have actually released."},{"id":"2027-06-w3-s3","title":"Ask one clear question","how":"Can an A&R representative consider your private demo?"},{"id":"2027-06-w3-s4","title":"Proofread links and names","how":"Never send an unfinished template or attachment-heavy email."}]},{"id":"2027-06-w4","week":4,"title":"Send the first round","why":"An introduction is a test, not a measure of your value.","done":"Documented outreach to the highest-fit contacts.","steps":[{"id":"2027-06-w4-s1","title":"Confirm that submissions are welcome","how":"Respect stated no-unsolicited-demo policies."},{"id":"2027-06-w4-s2","title":"Send personalised messages","how":"Start with two or three most promising contacts."},{"id":"2027-06-w4-s3","title":"Log each message","how":"Track contact, date, links and any next action."},{"id":"2027-06-w4-s4","title":"Keep building music","how":"Do not stop creating while waiting for replies."}]}]},{"id":"2027-07","name":"July 2027","phase":"PITCH","focus":"Follow up and protect your options","deliverable":"Clear status of label conversations and a plan for August","weeks":[{"id":"2027-07-w1","week":1,"title":"Track responses properly","why":"Silence is common and not a final verdict on the music.","done":"A clean contact log without repeated chasing.","steps":[{"id":"2027-07-w1-s1","title":"Wait a reasonable interval","how":"Follow each label’s stated response window if provided."},{"id":"2027-07-w1-s2","title":"Send one polite follow-up","how":"Include the original link and keep the message brief."},{"id":"2027-07-w1-s3","title":"Record actual interest","how":"Separate genuine meetings from automated replies or vague compliments."},{"id":"2027-07-w1-s4","title":"Close the first outreach cycle","how":"Move unresponsive contacts into a later review list."}]},{"id":"2027-07-w2","week":2,"title":"Prepare for A&R conversations","why":"Be ready to discuss both songs and business.","done":"A short meeting sheet and your questions.","steps":[{"id":"2027-07-w2-s1","title":"Rehearse your two-minute introduction","how":"Explain the sound and what the project needs."},{"id":"2027-07-w2-s2","title":"Bring the three demos and live take","how":"Know which song to play first."},{"id":"2027-07-w2-s3","title":"Ask about their development process","how":"Who handles A&R, content, marketing, radio or PR?"},{"id":"2027-07-w2-s4","title":"Write answers down","how":"Do not agree to terms during an informal introductory meeting."}]},{"id":"2027-07-w3","week":3,"title":"Review any offer carefully","why":"The biggest risk is transferring too much for too little support.","done":"An independent evaluation before any signature.","steps":[{"id":"2027-07-w3-s1","title":"Ask for a written deal summary","how":"Include term, revenue split, ownership and budget."},{"id":"2027-07-w3-s2","title":"Identify recoupable costs","how":"Ask whether advertising spend comes out of your share."},{"id":"2027-07-w3-s3","title":"Check release and reversion terms","how":"What if the label never releases the song?"},{"id":"2027-07-w3-s4","title":"Get independent legal advice","how":"Use a qualified Thai music/entertainment lawyer for actual agreements."}]},{"id":"2027-07-w4","week":4,"title":"Plan your academic transition","why":"Doctorate starts next month; protect the project from an unrealistic schedule.","done":"A sustainable 6–8-hour creative routine ready for August.","steps":[{"id": function done(id){return !!state.checked[id]};function isReady(id){return !!state.readiness[id]};function allSteps(){return PLAN.flatMap(m=>m.weeks.flatMap(w=>w.steps))}

<div class="status-banner"><div><strong>${r===READY.length?'Pitch assets checklist complete':'Preparation checklist'}</strong><p>Tick these only when you have the actual files or proof. Finishing this checklist does not guarantee a deal, and you can contact A&R earlier if a suitable introduction arises.</p></div><div class="status-number">${r} / ${READY.length}</div></div>
<div class="section-head"><h2>12 things to have ready</h2><span class="subtle">Open the linked month to work on each item</span></div><div class="readiness-list">${READY.map(r=>`<label class="readiness-item ${isReady(r.id)?'checked':''}"><input type="checkbox" data-ready-id="${r.id}" ${isReady(r.id)?'checked':''}><span><strong>${safe(r.title)}</strong><small>${safe(r.detail)}</small><button type="button" class="mini-btn" style="margin-top:9px;padding:5px 9px;font-size:10px" data-month="${r.month}">Go to ${safe((PLAN.find(m=>m.id===r.month)||{}).name||'month')} →</button></span></label>`).join('')}</div>
<div class="section-head"><h2>What you are asking the label for</h2></div><div class="reference-grid"><div class="ref-card"><h3>They could provide</h3><div class="line"></div><ul><li>Release planning and A&R feedback</li><li>Paid advertising and a person to manage it</li><li>Press contacts, industry introductions and promotion</li><li>Visual production, distributor coordination and reporting</li></ul></div><div class="ref-card"><h3>You can provide</h3><div class="line"></div><ul><li>Original songs and composition</li><li>Guitar performance and most core recordings</li><li>Production skills, instruments and studio equipment</li><li>A clear sound and realistic academic availability</li></ul></div></div>
<div class="section-head"><h2>Questions before signing</h2><span class="subtle">Take these to a lawyer for any real offer</span></div><section class="panel">${DEAL.map(d=>`<details class="deal"><summary>${safe(d[0])}</summary><p>${safe(d[1])}</p></details>`).join('')}</section>
<div class="callout">A label's marketing spend may be recouped from your royalties. Ask for written commitments and never assume that a big advertising figure is free money. Keep protected study funds outside the project.</div>
<div class="section-head"><h2>How we pitch</h2></div><div class="reference-grid"><div class="ref-card"><h3>One short introductory message</h3><div class="line"></div><p>“I'm developing a bedroom-pop project featuring guitar-led songs and impressionist-influenced harmony. I have three private demos and a live performance, and I'm looking for an A&R and promotional partner. May I send you the music?”</p><p style="margin-top:12px">Personalise it for each company. Only send once you have those materials.</p></div><div class="ref-card"><h3>What not to promise</h3><div class="line"></div><ul><li>Don't invent follower counts, streaming numbers or demand.</li><li>Don't promise one release per month.</li><li>Don't claim a genre or audience has been validated before testing.</li><li>Don't sign away rights just to get advertising.</li></ul></div></div>`, 'pitch')}
function brief(){return region(`<header class="page-head"><div><div class="overline">Reference sheet / editable direction</div><h1>Artist brief.</h1><p class="lead">The useful information from the presentation, without the presentation. These are working choices—not facts about an audience you haven't built yet.</p></div></header>
<section class="brief-lead"><div class="monogram">y.</div><div><small>YOEI / WORKING POSITIONING</small><p>Thai/English bedroom pop with intimate vocals, nylon-string guitar and impressionist-influenced harmony. Songs about solitude, imperfection and finding your own identity.</p></div></section>
<div class="reference-grid"><div class="ref-card"><div class="overline">USP / What makes it different</div><h3>Recognisable sound + human songs</h3><div class="line"></div><p>Guitar, detailed composition and modest bedroom production support direct melodies. The lyrics should connect to ordinary experiences rather than explain music theory.</p></div><div class="ref-card"><div class="overline">Listener hypothesis</div><h3>Niche first, accessible songs</h3><div class="line"></div><p>Start with Thai alternative/bedroom-pop listeners roughly 18–35, and international indie communities. This is a target to test—not verified demand.</p></div><div class="ref-card"><div class="overline">A&R / Repertoire</div><h3>Three songs with distinct roles</h3><div class="line"></div><ul><li>Song 01 — direct, memorable gateway song</li><li>Song 02 — different groove and emotional colour</li><li>Song 03 — more composition-led and cinematic</li></ul></div><div class="ref-card"><div class="overline">Sound principles</div><h3>The Yoei palette</h3><div class="line"></div><p>Nylon-string guitar; a comfortable, personal singing voice; memorable motifs; modal/extended harmony where useful; careful sound design; a melody that still works when stripped down.</p></div></div>
<div class="section-head"><h2>SWOT</h2><span class="subtle">Current development assessment</span></div><div class="reference-grid"><div class="ref-card"><div class="overline">Strengths</div><p>Guitar performance, composition training, orchestration, music production, available home studio and willingness to seek critique.</p></div><div class="ref-card"><div class="overline">Weaknesses</div><p>Zero finished originals at baseline, beginner vocals, lyric-writing gap, limited spending capacity and no established recording-artist audience.</p></div><div class="ref-card"><div class="overline">Opportunities</div><p>Alternative music communities, small performances, creative collaborations, soundtrack commissions, bilingual songs and direct fan support.</p></div><div class="ref-card"><div class="overline">Threats</div><p>Perfectionism delaying completion, low cash reserves, attention competition, unclear artist name and doctoral workload from August 2027.</p></div></div>
<div class="section-head"><h2>4Ps / Practical marketing</h2></div><div class="reference-grid"><div class="ref-card"><h3>Product</h3><p>Original songs; simple live takes; eventually a cohesive album and intimate band show.</p></div><div class="ref-card"><h3>Price</h3><p>Free-to-hear discovery; paid tickets and optional direct support once demand exists.</p></div><div class="ref-card"><h3>Place</h3><p>Spotify and YouTube for listening, Instagram for identity, selected short clips and small live venues.</p></div><div class="ref-card"><h3>Promotion</h3><p>Song-led clips, genuine performances, relevant collaborations and targeted label-supported marketing, if agreed.</p></div></div>
<div class="section-head"><h2>Time and money</h2><span class="subtle">Change these settings anytime</span></div><section class="panel"><h3>Constraints</h3><p class="quiet-note" style="margin-top:3px">The values below are planning limits, not recommended spending targets. Your doctorate and living expenses come first.</p><div class="budget-inputs"><label><span class="field-label">Monthly music ceiling (THB)</span><span class="number-field"><span>฿</span><input type="number" min="0" max="1000000" step="500" data-setting="monthlyBudget" value="${state.monthlyBudget}"></span></label><label><span class="field-label">Hours/week before Aug 2027</span><span class="number-field"><span>h</span><input type="number" min="0" max="100" step="1" data-setting="preHours" value="${state.preHours}"></span></label><label><span class="field-label">Hours/week from Aug 2027</span><span class="number-field"><span>h</span><input type="number" min="0" max="100" step="1" data-setting="postHours" value="${state.postHours}"></span></label></div><div class="callout" style="margin-bottom:0">An example split for a ฿5,000 ceiling: up to ฿2,000 singing lessons, ฿500 feedback, ฿500 release savings and ฿2,000 untouched reserve. Spend less if necessary.</div></section>
<div class="section-head"><h2>Working rules</h2></div><div class="reference-grid"><div class="ref-card"><h3>Keep</h3><ul class="simple-list"><li>Your own songwriting voice and long-term catalogue.</li><li>Time to learn singing without needing to appear perfect.</li><li>Realistic deadlines and enough time for doctoral studies.</li><li>Rights and finances understood before accepting a deal.</li></ul></div><div class="ref-card"><h3>Avoid</h3><ul class="simple-list"><li>Making an album before three songs are strong.</li><li>Buying gear or ads to compensate for unfinished music.</li><li>Forced daily personal-content posting.</li><li>Calling ordinary planning targets guaranteed results.</li></ul></div></div>
<div class="section-head"><h2>Data and backups</h2></div><section class="panel"><h3>Your progress stays on this device</h3><p class="quiet-note">This is an offline-first file. It does not use accounts, a server or analytics. Browser storage can disappear if you clear site data or move to another device. Export JSON backups regularly, and import a backup to continue elsewhere.</p><div class="anchor-row"><button class="mini-btn primary" id="export-inline">Export progress .json</button><button class="mini-btn" id="import-inline">Import backup</button><button class="mini-btn danger-btn" id="reset-inline">Reset all progress</button></div></section>`, 'brief')}
function render(){const v=['overview','plan','pitch','brief'].includes(state.view)?state.view:'overview';const pages={overview,pitch,plan,brief};document.getElementById('view-root').innerHTML=pages[v]();document.getElementById('breadcrumb').textContent='YOEI / '+({overview:'OVERVIEW',plan:'MONTHLY PLAN',pitch:'LABEL PITCH',brief:'ARTIST BRIEF'}[v]);document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.toggle('active',b.dataset.view===v);b.setAttribute('aria-current',b.dataset.view===v?'page':'false')})}
function changeView(view,scroll=true){state.view=view;save();render();if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function selectMonth(id){state.selectedMonth=id;currentFilter='all';openWeeks.clear();const m=monthData();const w=m.weeks.find(w=>w.steps.some(s=>!done(s.id)))||m.weeks[0];openWeeks.add(w.id);changeView('plan')}
function jumpWeek(id){const key=id.slice(0,7);if(state.selectedMonth!==key){state.selectedMonth=key;openWeeks.clear()}openWeeks.add(id);changeView('plan',false);setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}),60)}
function exportData(){const json=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='YOEI_tracker_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Backup file exported')}
async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(data.version!==1||!data.checked||!data.readiness||typeof data.checked!=='object'||typeof data.readiness!=='object')throw new Error('Not a YOEI backup');if(!confirm('Import this backup and replace the progress on this device?'))return;const object=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};state={...DEFAULT,...data,checked:object(data.checked),readiness:object(data.readiness),weekNotes:object(data.weekNotes),monthNotes:object(data.monthNotes)};save();render();notify('Backup imported successfully')}catch(e){notify('Could not import this file')}}
function resetData(){if(confirm('Reset every checkbox, note and setting on this device? Export a backup first if you want to keep anything.')){state={...DEFAULT};openWeeks.clear();save();render();notify('Tracker reset')}}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){changeView(v.dataset.view);return}const m=e.target.closest('[data-month]');if(m){selectMonth(m.dataset.month);return}const j=e.target.closest('[data-jump-week]');if(j){jumpWeek(j.dataset.jumpWeek);return}const g=e.target.closest('[data-go-month]');if(g){const n=Math.min(PLAN.length-1,Math.max(0,PLAN.findIndex(m=>m.id===state.selectedMonth)+Number(g.dataset.goMonth)));selectMonth(PLAN[n].id);return}const t=e.target.closest('[data-toggle-week]');if(t){const id=t.dataset.toggleWeek;if(openWeeks.has(id))openWeeks.delete(id);else openWeeks.add(id);render();return}const f=e.target.closest('[data-filter]');if(f){currentFilter=f.dataset.filter;render();return}if(e.target.id==='btn-export'||e.target.id==='export-inline'){exportData();return}if(e.target.id==='btn-import'||e.target.id==='import-inline'){document.getElementById('file-import').click();return}if(e.target.id==='btn-print'){window.print();return}if(e.target.id==='reset-inline'){resetData();return}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-task-id]')){state.checked[t.dataset.taskId]=t.checked;save();render();return}if(t.matches('[data-ready-id]')){state.readiness[t.dataset.readyId]=t.checked;save();render();return}if(t.matches('[data-setting]')){const name=t.dataset.setting;const max=name==='monthlyBudget'?1000000:100;state[name]=Math.max(0,Math.min(max,Number(t.value)||0));save();render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-week-note]')){state.weekNotes[t.dataset.weekNote]=t.value;save()}if(t.matches('[data-month-note]')){state.monthNotes[t.dataset.monthNote]=t.value;save()}});
document.getElementById('file-import').addEventListener('change',e=>{importData(e.target.files[0]);e.target.value=''});
render();
</script>
</body>
</html>
