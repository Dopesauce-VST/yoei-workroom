iv><div class="help" id="help">SELECT AN OBJECT TO INSPECT · TAP OR CLICK</div><button class="return" id="return">← RETURN TO ROOM</button><div class="focus-layer" id="focusLayer"><div class="artifact" id="artifact"></div></div><div class="navhelper"><button id="allObjects">OBJECTS · 10</button></div><div class="guide" id="guide"></div><div class="toast" id="toast"></div><audio id="player"></audio></div>
<script>
'use strict';
const $=q=>document.querySelector(q);const world=$('#world'),layer=$('#focusLayer'),artifact=$('#artifact'),back=$('#return'),help=$('#help'),audio=$('#player');
const names={turntable:'TURNTABLE',calendar:'DAILY PLANNER',thesis:'RESEARCH BOOK',project:'PROJECT WALL',clock:'FLIP CLOCK',mine:'MY RECORDS',favorites:'FAVORITES',research:'THESIS REFERENCES',global:'GLOBAL RELEASES',computer:'WORKSTATION'};
const STORAGE='yoei-studio-v1.0';const empty={tasks:[],notes:{},collections:{mine:[],favorites:[],research:[],global:[]},chapters:[0,0,0],experiments:[],projects:[],clients:[],alarm:'',volume:70};let state;try{state={...empty,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch{state=structuredClone(empty)};
let active=null,tab='today',timerSeconds=25*60,timerEnd=0,timerTicker=null,alarmTick=null,clockSource='clock',power=true,playing=false,recordIndex=0,localUrls=[];
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){toast('Storage full · export backup')}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=(t,attrs={})=>{const n=document.createElement(t);Object.assign(n,attrs);return n};
const toast=t=>{const n=$('#toast');n.textContent=t;n.classList.add('show');clearTimeout(n.timer);n.timer=setTimeout(()=>n.classList.remove('show'),2500)};
function persistNote(key,v){state.notes[key]=v;save()}
function inspect(id){if(active)close();active=id;$('#guide').classList.remove('open');world.classList.add('focused');layer.classList.add('visible');back.classList.add('show');help.classList.add('hidden');artifact.className='artifact';artifact.innerHTML='';render(id);requestAnimationFrame(()=>{requestAnimationFrame(()=>artifact.classList.add('in'))});}
function close(){if(!active)return;active=null;artifact.classList.remove('in');artifact.classList.add('out');world.classList.remove('focused');back.classList.remove('show');help.classList.remove('hidden');setTimeout(()=>{if(!active){layer.classList.remove('visible');artifact.innerHTML=''}},360)}
back.onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'||e.key===' '){if(document.activeElement?.classList.contains('zone')){e.preventDefault();inspect(document.activeElement.dataset.id)}}});
document.querySelectorAll('.zone').forEach(z=>{z.onclick=()=>inspect(z.dataset.id);z.addEventListener('pointerenter',()=>{$('#hoverName').textContent=names[z.dataset.id]+'   /   INSPECT';$('#hoverName').classList.add('visible')});z.addEventListener('pointerleave',()=>$('#hoverName').classList.remove('visible'))});
$('#allObjects').onclick=()=>$('#guide').classList.toggle('open');$('#guide').innerHTML=Object.entries(names).map(([k,v])=>`<button data-go="${k}">${v}</button>`).join('');$('#guide').onclick=e=>{const b=e.target.closest('[data-go]');if(b)inspect(b.dataset.go)};
function paper(title,identifier,inner,dark=false){artifact.innerHTML=`<section class="paper-object ${dark?'dark':''}"><header class="paperhead"><div><small>${esc(identifier)}</small><h2>${esc(title)}</h2></div><small>YOEI / STUDIO</small></header><main class="paperbody" id="sheet">${inner}</main></section>`;}
function tabs(items,selected){return `<div class="tabline">${items.map(x=>`<button data-tab="${x[0]}" class="${selected===x[0]?'active':''}">${x[1]}</button>`).join('')}</div>`}
function row(id,text,detail='',actions=''){return `<div class="itemrow" data-entry="${esc(id)}"><span>${esc(text)}${detail?`<br><small>${esc(detail)}</small>`:''}</span>${actions}</div>`}
function form(placeholder,button='ADD'){return `<form id="newItem" class="compose"><input class="field" name="text" placeholder="${esc(placeholder)}" maxlength="220" required><button class="action">${button}</button></form>`}
function note(key,placeholder){return `<textarea class="memo" data-note="${key}" placeholder="${esc(placeholder)}">${esc(state.notes[key]||'')}</textarea><div class="tiny-note">Stored on this device · Export backups regularly</div>`}
function render(id){switch(id){case'turntable':return turntable();case'calendar':return calendar();case'thesis':return thesis();case'clock':return clock();case'project':return project();case'computer':return computer();default:return vinyl(id)}}
function bindNotes(){document.querySelectorAll('[data-note]').forEach(n=>n.addEventListener('input',()=>persistNote(n.dataset.note,n.value)))}
function bindTabs(fn){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;fn()})}
function turntable(){artifact.innerHTML=`<div class="hardware"><div class="desk"><div class="platter"><div class="record ${playing?'spinning':''}" id="record"><div class="labeldisc">YOEI<br>33 ⅓ RPM</div></div></div><div class="armbase"></div><div class="tonearm ${playing?'on':''}" id="tonearm"></div><div class="model">STUDIO / ANALOG SERIES I</div><button class="physical powerctl" id="power"><span class="metalbutton"></span><span>POWER</span><span class="led ${power?'lit':''}"></span></button><button class="physical startctl" id="start"><span class="metalbutton"></span><span>${playing?'STOP':'START'}</span><span class="led ${playing?'lit':''}"></span></button><button class="physical speedctl" id="speed"><span class="metalbutton"></span><span id="speedVal">33⅓</span><span>RPM</span></button><label class="volume">OUTPUT<input id="volume" type="range" min="0" max="100" value="${state.volume}"></label><div class="decktitle">Y O E I</div></div><button class="sleeve" id="sleeve" aria-label="Open record collection"><span>RECORD<br>ARCHIVE</span><small>SELECT A RECORD</small></button><button class="sleeve-tag" id="choose">RECORDS / SELECT ↗</button><div class="inspection-instruction">SELECT RECORDS TO OPEN YOUR COLLECTION · OPERATE THE PHYSICAL SWITCHES</div></div>`;
 const sp=$('#speed');let rpm=33;const toggle=()=>{if(!power)return toast('Switch power on');if(!audio.src)return toast('Select an audio file first');if(audio.paused){audio.play().then(()=>{playing=true;setHardware()}).catch(()=>toast('Playback requires a user tap'))}else{audio.pause();playing=false;setHardware()}};
 const setHardware=()=>{$('#start').querySelectorAll('span')[1].textContent=playing?'STOP':'START';$('#record').classList.toggle('spinning',playing);$('#record').style.animationDuration=(60/rpm)+'s';$('#tonearm').classList.toggle('on',playing);$('#start .led').classList.toggle('lit',playing)};
 $('#start').onclick=toggle;$('#power').onclick=()=>{power=!power;$('#power .led').classList.toggle('lit',power);if(!power&&playing)toggle()};sp.onclick=()=>{rpm=rpm===33?45:33;$('#speedVal').textContent=rpm===33?'33⅓':'45';setHardware();toast(rpm+' RPM')};$('#volume').oninput=e=>{audio.volume=e.target.value/100;state.volume=+e.target.value;save()};audio.volume=state.volume/100;$('#sleeve').onclick=$('#choose').onclick=()=>inspect('mine');}
const days=['Today','Week','Month','Routines'];
function calendar(){const now=new Date(),d=now.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});if(!['today','week','month','routines'].includes(tab))tab='today';const items=state.tasks.filter(x=>x.scope===tab);paper('Daily planner',d,`${tabs([['today','TODAY'],['week','WEEK'],['month','MONTH'],['routines','ROUTINES']],tab)}<h3>${tab==='today'?'For today':days[['today','week','month','routines'].indexOf(tab)]}</h3><div id="taskRows">${items.map(x=>`<div class="itemrow"><input type="checkbox" data-check="${x.id}" ${x.done?'checked':''}><span style="${x.done?'text-decoration:line-through;opacity:.5':''}">${esc(x.text)}</span><button class="slim" data-del="${x.id}">×</button></div>`).join('')||'<div class="empty">A clear day. Add your first task below.</div>'}</div>${form('Write a task…')}<p class="tiny-note">Routine tasks remain in your routines list. Checkmarks are saved; use Reset to restart a routine.</p>${tab==='routines'?'<button class="slim" id="resetTasks">RESET ROUTINE CHECKMARKS</button>':''}`);bindTabs(calendar);$('#newItem').onsubmit=e=>{e.preventDefault();const v=e.target.text.value.trim();if(v){state.tasks.push({id:Date.now().toString(36),text:v,scope:tab,done:false});save();calendar()}};$('#sheet').onclick=e=>{const d=e.target.closest('[data-del]');if(d){state.tasks=state.tasks.filter(x=>x.id!==d.dataset.del);save();calendar()}if(e.target.id==='resetTasks'){state.tasks.forEach(x=>{if(x.scope==='routines')x.done=false});save();calendar()}};document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{const x=state.tasks.find(x=>x.id===e.dataset.check);if(x){x.done=e.checked;save();calendar()}})}
function thesis(){if(!['chapters','reading','experiments','notes','scores'].includes(tab))tab='chapters';paper('Thesis', 'RESEARCH / COMPOSITION',`${tabs([['chapters','CHAPTERS'],['reading','READING'],['experiments','EXPERIMENTS'],['notes','NOTES'],['scores','SCORES']],tab)}<div id="thesisBody"></div>`);bindTabs(thesis);const n=$('#thesisBody');if(tab==='chapters'){n.innerHTML=`<h3>Master's research</h3>${state.chapters.map((c,i)=>`<div class="itemrow"><span>Chapter ${i+1}<br><small>${c}% complete</small></span><div class="progressline"><span style="width:${c}%"></span></div><input aria-label="Chapter ${i+1} progress" data-chapter="${i}" type="range" min="0" max="100" step="5" value="${c}"></div>`).join('')}${note('thesis-outline','Chapter plan, revisions, pending sections…')}`;document.querySelectorAll('[data-chapter]').forEach(i=>i.oninput=()=>{state.chapters[+i.dataset.chapter]=+i.value;save();i.closest('.itemrow').querySelector('small').textContent=i.value+'% complete';i.closest('.itemrow').querySelector('.progressline>span').style.width=i.value+'%'})}
if(tab==='reading'||tab==='experiments'||tab==='scores'){const key=tab==='reading'?'research':tab==='experiments'?'experiments':'scores';state[key]=state[key]||[];n.innerHTML=`<h3>${{reading:'Reading list',experiments:'Experiment records',scores:'Score index'}[tab]}</h3>${state[key].map((x,i)=>row(String(i),x,'',`<button class="slim" data-remove="${i}">×</button>`)).join('')||'<div class="empty">No entries yet.</div>'}${form(tab==='reading'?'Paper, author, DOI or reference…':tab==='scores'?'Score title or file reference…':'Describe an experiment…')}`;$('#newItem').onsubmit=e=>{e.preventDefault();state[key].push(e.target.text.value.trim());save();thesis()};n.onclick=e=>{const b=e.target.closest('[data-remove]');if(b){state[key].splice(+b.dataset.remove,1);save();thesis()}}}
if(tab==='notes')n.innerHTML=`<h3>Research notebook</h3>${note('thesis-research','Record hypotheses, MIDI articulation, cohesion, spatial design…')}`;bindNotes()}
function project(){paper('Project wall','ARTIST / GROWTH',`<div class="overprint">Your YOEI roadmap</div><h3>Active milestones</h3>${state.projects.map((x,i)=>row(i,x,'',`<button class="slim" data-remove="${i}">×</button>`)).join('')||'<div class="empty">Add your current priorities. The existing main-site roadmap will be migrated after validation.</div>'}${form('Add a project milestone…')}${note('artist-strategy','Artist statement, goals, label preparation, SWOT, 4Ps…')}`);$('#newItem').onsubmit=e=>{e.preventDefault();state.projects.push(e.target.text.value.trim());save();project()};$('#sheet').onclick=e=>{let b=e.target.closest('[data-remove]');if(b){state.projects.splice(+b.dataset.remove,1);save();project()}};bindNotes()}
function vinyl(id){let label={mine:'My recordings',favorites:'My favorites',research:'Thesis listening references',global:'International new releases'}[id];const coll=state.collections[id]||[];paper(label,'VINYL ARCHIVE / '+id.toUpperCase(),`<div class="overprint">RECORD COLLECTION</div><div class="folderlayout">${coll.map((x,i)=>`<button class="disc-card" data-disc="${i}"><span>◉</span>${esc(x.title.slice(0,25))}<small>${esc(x.type||'REFERENCE')}</small></button>`).join('')}</div>${coll.length?'':'<div class="empty">Your collection is empty. Add a record below.</div>'}<form class="compose" id="newItem"><input name="text" class="field" placeholder="Track or album title" required><button class="action">ADD RECORD</button></form><p class="tiny-note">Save an official video URL or a note for each record. Imported audio files stay local to your session.</p><button class="slim" id="importAudio">LOAD LOCAL AUDIO</button><input type="file" id="audioFile" accept="audio/*" hidden>${note('collection-'+id,'Collection notes…')}`);$('#newItem').onsubmit=e=>{e.preventDefault();coll.push({title:e.target.text.value.trim(),type:'RECORD',url:''});state.collections[id]=coll;save();vinyl(id)};document.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>{recordIndex=+b.dataset.disc;recordDetails(id,recordIndex)});$('#importAudio').onclick=()=>$('#audioFile').click();$('#audioFile').onchange=e=>{let f=e.target.files[0];if(!f)return;localUrls.forEach(URL.revokeObjectURL);localUrls=[URL.createObjectURL(f)];audio.src=localUrls[0];audio.load();toast('Loaded '+f.name+' · return to turntable to play')};bindNotes()}
function recordDetails(id,i){let x=state.collections[id]?.[i];if(!x)return vinyl(id);paper(x.title,'SELECTED RECORD',`<div class="overprint">ARCHIVE ENTRY</div><h3>Listening notes</h3>${note('record-'+id+'-'+i,'What makes this recording worth keeping?')}<div class="compose"><input class="field" type="url" id="recurl" placeholder="Official YouTube video URL" value="${esc(x.url||'')}"><button class="action" id="storeurl">SAVE LINK</button></div><div class="screenbar"><button class="slim" id="backtocoll">← COLLECTION</button><button class="slim" id="removeRec">REMOVE</button></div><p class="tiny-note">The official video opens on YouTube; audio is not extracted.</p>`);$('#storeurl').onclick=()=>{const v=$('#recurl').value.trim();if(v&&!/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(v))return toast('Use an official YouTube link');x.url=v;save();toast('Saved')};$('#backtocoll').onclick=()=>vinyl(id);$('#removeRec').onclick=()=>{state.collections[id].splice(i,1);save();vinyl(id)};if(x.url){const b=el('button',{textContent:'OPEN OFFICIAL VIDEO',className:'action'});b.onclick=()=>window.open(x.url,'_blank','noopener,noreferrer');$('#sheet').append(b)}bindNotes()}
function computer(){paper('Workstation','CLIENT / PRODUCTION',`<div class="overprint">PRIVATE CLIENT PROJECTS</div><h3>Projects</h3>${state.clients.map((x,i)=>row(i,x,'',`<button class="slim" data-remove="${i}">×</button>`)).join('')||'<div class="empty">No projects yet.</div>'}${form('Project or client name…')}${note('client-notes','Session notes, delivery dates, revision status…')}<p class="tiny-note">Future: secure remote session and Cubase audio collaboration. Not currently connected.</p>`);$('#newItem').onsubmit=e=>{e.preventDefault();state.clients.push(e.target.text.value.trim());save();computer()};$('#sheet').onclick=e=>{let b=e.target.closest('[data-remove]');if(b){state.clients.splice(+b.dataset.remove,1);save();computer()}};bindNotes()}
function clock(){const now=new Date();artifact.innerHTML=`<div class="clockface"><div class="flipclock"><div class="timerdigit" id="timeDisplay">${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="clocktools"><div class="faux-label">DESK CLOCK · ALARM · TIMER</div><div class="timerdigit" id="timerDisplay" style="font-size:clamp(24px,5vw,58px)">${Math.floor(timerSeconds/60).toString().padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}</div><div><button class="slim" id="set25">25 MIN</button><button class="slim" id="set45">45 MIN</button><button class="slim" id="runTimer">${timerEnd?'PAUSE':'START'}</button><button class="slim" id="resetTimer">RESET</button></div><div class="quiet" style="margin-top:14px">ALARM <input aria-label="Alarm time" id="alarm" type="time" value="${state.alarm||''}" style="background:#2a2a27;color:white;border:1px solid #888;padding:7px"><button class="slim" id="saveAlarm">SET</button></div><p class="tiny-note">Clock and timer run while this browser tab stays open. iPad may suspend timers in the background.</p></div></div>`;$('#set25').onclick=()=>{timerEnd=0;timerSeconds=25*60;clock()};$('#set45').onclick=()=>{timerEnd=0;timerSeconds=45*60;clock()};$('#runTimer').onclick=()=>{if(timerEnd){timerSeconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerEnd=0}else timerEnd=Date.now()+timerSeconds*1000;clock()};$('#resetTimer').onclick=()=>{timerEnd=0;timerSeconds=25*60;clock()};$('#saveAlarm').onclick=()=>{state.alarm=$('#alarm').value;save();toast(state.alarm?'Alarm set':'Alarm cleared')};updateClock()}
let alarmFiredDate='';function updateClock(){if(active!=='clock')return;let d=new Date(),m=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});if($('#timeDisplay'))$('#timeDisplay').textContent=m;if(timerEnd){let s=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if($('#timerDisplay'))$('#timerDisplay').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s===0){timerEnd=0;toast('Focus session complete');try{navigator.vibrate?.([100,100,100])}catch{}}}if(state.alarm&&m===state.alarm){const k=d.toDateString()+state.alarm;if(alarmFiredDate!==k){alarmFiredDate=k;toast('Alarm · '+m)}}}
setInterval(updateClock,250);
// The backup format has an explicit version and is validated before import.
function downloadBackup(){const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=el('a',{href:u,download:'yoei-studio-backup.json'});a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const info=document.createElement('button');info.textContent='BACKUP';info.className='slim';info.style.cssText='position:fixed;bottom:20px;left:20px;z-index:3;background:#141714aa;color:#e0e0d9;border-color:#888';info.onclick=downloadBackup;document.body.append(info);
const restore=el('input',{type:'file',accept:'application/json'});restore.style.display='none';document.body.append(restore);restore.onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(v.version!==1||!v.data||!Array.isArray(v.data.tasks)||!v.data.collections)throw Error('Invalid backup');if(!confirm('Replace local YOEI Studio data with the imported backup?'))return;state={...empty,...v.data};save();if(active)render(active);toast('Backup restored')}catch(e){toast('Could not read backup')}};
const restoreBtn=el('button',{textContent:'RESTORE',className:'slim'});restoreBtn.style.cssText=info.style.cssText+';left:95px';restoreBtn.onclick=()=>restore.click();document.body.append(restoreBtn);
</script></body></html>
